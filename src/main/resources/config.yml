config-version: 5
# ======================= GENEL / MESAJLAR =======================
# Yer tutucular: {server} {player} {online} (+ boss bar icin asagidaki liste)
server-name: "ChicagoRP"
prefix: "&8[&6&l{server}&8] &7» &f"
join-message: "&8[&a+&8] &f{player} &7şehre geldi &8(&e{online}&8)"
quit-message: "&8[&c-&8] &f{player} &7şehirden ayrıldı"
welcome-title: "&6&l{server}"
welcome-subtitle: "&7Hoş geldin, &f{player}"
job-expire-hours: 48               # bu kadar saat girmeyen oyuncu meslegini kaybeder
# ======================= BOSS BAR (ekranin ustu) =======================
# Yer tutucular: {player} {server} {online} {level} {xp} {xp_next} {xp_percent} {xp_bar} {money} {bank} {total}
#   {job} {job_count} {job_capacity} {gang} {gang_symbol} {gang_color} {gang_members} {gang_tag} {plots} {generators}
#   {wanted} {car} {speed} {car_hp} {license} {tc} {pvp}      PlaceholderAPI varsa: %chicagorp_level% %chicagorp_money% ... (ayni isimler)
bossbar:
  enabled: true
  text: "&6&l{server} &8| &fSeviye &e{level} &8| &fNakit &a{money} TL &8| &fBanka &b{bank} TL &8| &f{job} &8| &f{gang_tag}"
  color: PURPLE                    # PINK BLUE RED GREEN YELLOW PURPLE WHITE
  style: PROGRESS                  # PROGRESS NOTCHED_6 NOTCHED_10 NOTCHED_12 NOTCHED_20
  progress: xp                     # xp | health | full
# ======================= MODELLER / KAYNAK PAKETI =======================
models:
  enabled: true
  vehicle-yaw-offset: 0
  sign-yaw-offset: 0
  arrow-yaw-offset: 180            # yol oku ters gorunuyorsa 0 (veya /sehir okcevir)
resource-pack:
  url: ""
  sha1: "065e388041a4b280203fb3b8dddc2df9890d4872"
  required: true
# ======================= ARACLAR =======================
vehicle:
  horse-scale: 0.25                # kucuk = surucu daha alcakta oturur (canli ayar: /aracayar scale 0.2)
  seat-y: 0.25                     # yolcu koltugu yuksekligi (/aracayar seat-y 0.1)
  model-y: 0.0                     # govdeyi yukari/asagi kaydir
  idle-speed: 0.05                 # duragan taban hiz
  accel: 0.0035                    # tick basina hizlanma (kucuk = yavas hizlanir)
  brake: 0.012                     # birakinca yavaslama
  speedometer: true
  crash-damage: 55                 # carpma hasari carpani
  repair-cost-per-hp: 50           # arac sahibi odeme (% basina)
  repair-pay-per-hp: 45            # mekanigin kazandigi (% basina)
  max-passengers: 4
gallery:
  pay-from-bank: true
guns-enabled: true
# Meslege ozel ucretsiz arac (/arac is)
job-vehicles: {polis: polis_araci, taksici: taksi, kargocu: kargo_van, mekanik: mekanik_pickup, durumcu: durum_motor}
# Modifiyeci: boya + motor paketi
tuning:
  paint-price: 5000
  engine-prices: [25000, 60000, 120000]
  colors:
    Kırmızı: "#C8201E"
    Koyu Kırmızı: "#7A1018"
    Turuncu: "#F07A14"
    Sarı: "#F2C21E"
    Limon: "#96E82A"
    Yeşil: "#28A53E"
    Koyu Yeşil: "#1E5A32"
    Turkuaz: "#1E8C8C"
    Gök Mavisi: "#78BEF0"
    Mavi: "#1E55C8"
    Lacivert: "#142358"
    Mor: "#8734C3"
    Pembe: "#E678AA"
    Beyaz: "#F2F2F2"
    Gümüş: "#B8BCC4"
    Gri: "#6E7078"
    Siyah: "#181A1E"
    Kahverengi: "#704830"
    Bordo: "#5A141E"
    Altın: "#D7AA28"
# ======================= MESLEKLER =======================
job-capacity:
  polis: 8
  ciftci: 20
  kimyager: 8
  torbaci: 12
  demirci: 6
  kargocu: 10
  silah_ustasi: 3
  balikci: -1
  mekanik: 6
  taksici: 8
  durumcu: 6
  kacakci: 5
  soyguncu: 8
# Meslek bilgileri (telefon > Isler'de sag tik, /meslek bilgi <meslek>)
jobs:
  ciftci:
    desc: "Yasaklı madde ağının ilk halkası: tarla kiralar, ham madde yetiştirir."
    income: "~24.000 TL/saat (yasa dışı)"
    how: ["/tarla kirala  → tarlayı 24 saat kiralarsın", "/tarla ek  → ekimi başlatırsın", "10 dk sonra /tarla topla  → 20 ham madde", "/tarla sat  → ham madde NPC'sine satarsın (200 TL/adet)"]
  kimyager:
    desc: "Çiftçilerin sattığı ham maddeyi işleyip yasaklı maddeye çevirir."
    income: "~24.000 TL/saat (yasa dışı)"
    how: ["/kimya al  → stoktaki ham maddeyi satın alırsın", "/kimya yap  → 60 sn işler", "/kimya sat  → el altı NPC'sine satarsın (280 TL/adet)"]
  torbaci:
    desc: "El altından malı alıp müşterilere teslim eder."
    income: "~24.000 TL/saat (yasa dışı)"
    how: ["/elalti al  → el altı stokundan mal alırsın", "Müşteriye yaklaş (6 blok)", "/elalti teslim <oyuncu>  → teslimat ücreti alırsın"]
  demirci:
    desc: "Oyunculardan gelen zırh siparişlerini üretir."
    income: "~18.000 TL/saat"
    how: ["Sipariş gelince /siparis kabul <id>", "Kargocu malzemeyi getirir", "Üretim süresi dolunca ücret otomatik ödenir", "Aynı anda tek iş yapabilirsin"]
  kargocu:
    desc: "Şehirde paket taşır ve demirciye malzeme getirir."
    income: "~18.000 TL/saat"
    how: ["/kargo gorev  → paket alırsın, yol tarifi açılır", "Teslim noktasına git (yaklaşınca otomatik teslim)", "Hızlı teslimde +%25 bonus", "Zırh siparişleri için: /siparis kargo <id> ve /siparis teslimmat <id>", "Telefon > /arac is ile Kargo Van"]
  silah_ustasi:
    desc: "Tüfek, pompalı ve keskin nişancı üretir. Polis haberdar edilir."
    income: "Silah satışı (oyuncu pazarlığı)"
    how: ["/silah uret <silah>  → malzeme bedeli ödenir, üretim başlar (20-40 dk)", "Üretim boyunca polise konumun bildirilir", "Bitince silah envanterine gelir; polis engelleyebilir"]
  balikci:
    desc: "Limandan olta atarak balık satar."
    income: "~18.000 TL/saat"
    how: ["Telefon > Şehir > Liman'a git", "Olta at, balık yakala", "Her balık otomatik para kazandırır"]
  mekanik:
    desc: "Kaza yapan araçları tamir eder."
    income: "~18.000 TL/saat"
    how: ["Meslek seçince Tamir Çantası verilir", "Bozuk/hasarlı araca çantayla sağ tıkla (6 sn)", "Ücreti araç sahibi öder, sen kazanırsın", "/arac is  → Mekanik Pickup"]
  taksici:
    desc: "Oyuncuları istedikleri yere götürür."
    income: "~18.000 TL/saat"
    how: ["Yolcu /taksi cagir <yer> yazınca sana bildirim gelir", "/taksi kabul <oyuncu>  → yolcuya git, yol tarifi açılır", "Yolcu aracına binince hedef işaretlenir", "Hedefe varınca ücret yolcudan otomatik alınır", "/arac is  → Taksi"]
  durumcu:
    desc: "Dürüm yapıp müşteriye ya da tezgaha satar."
    income: "~18.000 TL/saat"
    how: ["Dürümcü dükkanında /durum yap  → 20 sn'de dürüm (60 TL malzeme)", "/durum tezgah  → dükkandan sat (480 TL/adet)", "Ya da /durum sat <oyuncu> <fiyat>; müşteri /durum kabul yazar", "/arac is  → Dürüm Motoru"]
  polis:
    desc: "Düzeni sağlar, suçluları kelepçeler ve tutuklar."
    income: "Tutuklama ödülü (~20.000 TL/saat)"
    how: ["Meslek seçince zırh, cop, kelepçe ve Glock verilir", "Oyuncuya kelepçeyle sağ tık → kelepçeler (tekrar tık çözer)", "/tutukla <oyuncu>  → hapse gönderir, ödül alırsın", "İhbar/soygun/silah üretimi bildirimleri yol tarifiyle gelir", "/arac is  → Polis Aracı"]
  kacakci:
    desc: "Limandan kaçak mal alıp gizli noktalara ulaştırır."
    income: "~24.000 TL/saat (yasa dışı)"
    how: ["Limanda /kacak al  → kaçak mal alırsın", "Telefon yol tarifi gizli teslim noktasını gösterir", "Teslim edince büyük ödeme alırsın", "Polise yaklaşık konumun bildirilir; yakalanırsan mal gider"]
  soyguncu:
    desc: "Dükkan ve bankaları soyar."
    income: "~24.000 TL/saat (yasa dışı)"
    how: ["En az 2 polis çevrimiçi olmalı", "Soyacağın yerin yanında /soygun <yer>", "120 sn bölgeden ayrılma ve hayatta kal", "Başarırsan para alırsın; polis anında bilgilendirilir"]
